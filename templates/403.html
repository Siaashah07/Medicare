<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>403 - Access Forbidden | Medicare Security</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fdf5f5; color: #721c24; min-height: 100vh; display: flex;
    justify-content: center; align-items: center; padding: 20px;
}
.card {
    background: white; max-width: 500px; width: 100%; padding: 40px 30px;
    border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center;
    border: 1px solid #f5c6cb;
}
.icon { font-size: 50px; margin-bottom: 15px; }
h1 { font-size: 26px; color: #721c24; margin-bottom: 10px; }
p { font-size: 14px; color: #60798e; line-height: 1.5; margin-bottom: 25px; }
.btn {
    display: inline-block; padding: 12px 28px; border-radius: 25px; background: #155985;
    color: white; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s;
}
.btn:hover { background: #0d466b; }
</style>
</head>
<body>
<div class="card">
    <div class="icon">🛑</div>
    <h1>403 - Access Forbidden</h1>
    <p>You do not have permission to view or modify this medical record or portal. This access attempt has been logged for security compliance.</p>
    <a href="/login" class="btn">Return to Secure Login →</a>
</div>
</body>
</html>
