<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Medicare</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f6fbfb;
            color: #123f73;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: white;
            padding: 45px 35px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .code {
            font-size: 72px;
            font-weight: 900;
            color: #35aa9a;
            line-height: 1;
            margin-bottom: 12px;
        }
        h2 { font-size: 22px; margin-bottom: 10px; color: #155985; }
        p { color: #718496; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .btn {
            display: inline-block;
            background: #155985;
            color: white;
            padding: 12px 28px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn:hover { background: #0e4265; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="code">404</div>
        <h2>Page Not Found</h2>
        <p>The medical record or page you are looking for does not exist or has been moved.</p>
        <a href="/dashboard" class="btn">← Back to Dashboard</a>
    </div>
</body>
</html>
